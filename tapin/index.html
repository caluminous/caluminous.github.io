<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tap In — tap the machine, log the workout</title>
<meta name="description" content="A workout tracker driven by NFC. Tap your phone on a gym machine to start, tap out to finish, tap the next machine to move on. Works with the tags already on gym kit or blank stickers you write yourself. Fully offline — everything stays on your phone.">
<meta name="theme-color" content="#0b0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap In">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="hdr-spacer"></div>
  <div id="brand" class="brand">Tap In</div>
  <button id="settingsBtn" class="hdr-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"></path>
    </svg>
  </button>
</header>

<main id="app"></main>

<nav id="nav" aria-label="Sections">
  <button class="nav-btn active" data-view="tap">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20a8 8 0 0 0 0-16"></path><path d="M12 16.5a4.5 4.5 0 0 0 0-9"></path>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
    </svg>
    <span>Tap</span>
  </button>
  <button class="nav-btn" data-view="log">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="4" width="16" height="17" rx="3"></rect>
      <path d="M8 3v3M16 3v3M8 11h8M8 15h5"></path>
    </svg>
    <span>Log</span>
  </button>
  <button class="nav-btn" data-view="plans">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 6h3M5 12h3M5 18h3M11 6h8M11 12h8M11 18h8"></path>
    </svg>
    <span>Plans</span>
  </button>
  <button class="nav-btn" data-view="kit">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"></path>
    </svg>
    <span>Kit</span>
  </button>
  <button class="nav-btn" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20V11M10 20V4M16 20v-6M22 20H2"></path>
    </svg>
    <span>Stats</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="nfc.js"></script>
<script src="track.js"></script>
<script src="session.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
