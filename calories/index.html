<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fuel — calorie &amp; training tracker</title>
<meta name="description" content="Track calories, macros, water, weight and workouts. Works out your maintenance calories and daily target. Fully offline, all data stays on your phone.">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <button id="todayBtn" class="hdr-btn" aria-label="Jump to today">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="3"></rect>
      <path d="M8 3v4M16 3v4M3 10h18"></path>
    </svg>
  </button>
  <div class="brand">Fuel</div>
  <button id="settingsBtn" class="hdr-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"></path>
    </svg>
  </button>
</header>

<main id="app"></main>

<button id="fab" aria-label="Log something">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<nav id="nav" aria-label="Sections">
  <button class="nav-btn active" data-view="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 7v10a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1V10z"></path></svg>
    <span>Today</span>
  </button>
  <button class="nav-btn" data-view="food">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 11v10M17 3c-1.6 1.4-2.4 3.4-2.4 5.6 0 1.7.8 2.9 2.4 3.2V21"></path></svg>
    <span>Food</span>
  </button>
  <button class="nav-btn" data-view="move">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"></path></svg>
    <span>Move</span>
  </button>
  <button class="nav-btn" data-view="body">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"></path><path d="M12 12l4-4"></path></svg>
    <span>Body</span>
  </button>
  <button class="nav-btn" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
    <span>Stats</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="calc.js"></script>
<script src="store.js"></script>
<script src="notify.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
